  @font-face { font-family:'Coolvetica';           src:url('../fonts/Coolvetica.otf') format('opentype'); font-display:swap; }
  @font-face { font-family:'Helvetica';            src:url('../fonts/Arimo-VF.ttf') format('truetype'); font-display:swap; }
  @font-face { font-family:'SF Pro Display';       src:url('../fonts/SFPro.ttf') format('truetype'); font-display:swap; }
  @font-face { font-family:'Thunderbolt';          src:url('../fonts/Thunderbolt.ttf') format('truetype'); font-display:swap; }
  /* Transparent so capturePage() yields an alpha PNG we can overlay in ffmpeg.
     The video is NEVER loaded here — it's composited natively by ffmpeg, which is
     why export is fast (no per-frame decoder seek). */
  html,body{margin:0;padding:0;background:transparent;overflow:hidden}
  #stage{position:relative;overflow:hidden;background:transparent}
</style>
</head>
<body>
  <div id="stage"></div>
  <script type="module">
    import { buildScenes, renderCaption, renderKinetic } from '../engine/caption-dom.mjs';
    const stage = document.getElementById('stage');
    let scenes = [], style = {}, project = {};

    // Inject user-uploaded @font-face rules (passed in from the render worker) and wait for them to
    // load BEFORE building scenes, so a custom font never falls back to a default in the render.
    async function injectCustomFonts(list) {
      if (!Array.isArray(list) || !list.length) return;
      const css = list.map((f) => `@font-face{font-family:'${String(f.family).replace(/'/g,'')}';src:url('${f.url}') format('${f.format||'truetype'}');font-display:block;}`).join('\n');
      const el = document.createElement('style'); el.id = 'customFontFaces'; el.textContent = css; document.head.appendChild(el);
      try { await Promise.all(list.map((f) => document.fonts.load(`32px '${String(f.family).replace(/'/g,'')}'`).catch(() => {}))); } catch {}
    }

    window.__setup = async (data) => {
      project = data.project; style = data.style;
      stage.style.width = project.__w + 'px';
      stage.style.height = project.__h + 'px';
      await injectCustomFonts(data.customFonts);
      scenes = buildScenes(project);
      return true;
    };

    // Paint the caption layer for time t. No video, no seeking — just the pure
    // function of t. Resolve after two frames so the paint has landed on screen.
    window.__seek = (t) => new Promise((resolve) => {
      renderCaption(stage, scenes, style, t, project);
      renderKinetic(stage, project, style, t);
      requestAnimationFrame(() => requestAnimationFrame(() => resolve(true)));
    });

    // fonts must be ready before first paint (avoids fallback-font frames). document.fonts.ready
    // alone resolves before any caption font is requested (nothing painted yet), so FORCE-load
    // every declared @font-face first, then await ready. One-time cost, guarantees the right glyphs.
    window.__fontsReady = async () => {
      try { await Promise.all([...document.fonts].map((f) => f.load().catch(() => {}))); } catch {}
      try { await document.fonts.ready; } catch {}
      return true;
    };
  </script>
</body>
